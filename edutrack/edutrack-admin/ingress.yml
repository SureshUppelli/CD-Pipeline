apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edutrack-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod-edutrack"
spec:
  tls:
  - hosts:
    - edu-test.wetasker.com
    - www.edu-test.wetasker.com
    secretName: edutrack-app-tls
  rules:
  - host: edu-test.wetasker.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edutrack-app-service
            port:
              number: 80
  - host: www.edu-test.wetasker.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edutrack-app-service
            port:
              number: 80